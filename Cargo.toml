[package]
name = "inference-router-program"
version = "0.9.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["receipt-prototype"]
no-entrypoint = []
local-test = []
receipt-prototype = []

[dependencies]
pinocchio = "0.11.2"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = "0.10"
