name: bun security fixes
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: bun-security
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: apply native fixes within existing compatibility ranges
        id: fix
        run: node .github/bun-audit.mjs ops
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.fix.outputs.changed == 'true'
        id: pr
        with:
          token: ${{ github.token }}
          branch: security/bun-audit
          base: main
          title: '[fix] vulnerable bun dependencies'
          commit-message: '[fix] vulnerable bun dependencies'
          body: 'Native Bun audit fixes compatible vulnerable dependencies only; required CI and Copilot review gate merging, while remaining advisories and incompatible upgrades stay available for review.'
          labels: security
          add-paths: |
            ops/package.json
            ops/bun.lock
      - name: run required ci for workflow-created updates
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'ci.yml', ref: 'security/bun-audit' });
      - name: report blocked security upgrades
        if: steps.fix.outputs.remaining != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('Some vulnerabilities require incompatible upgrades or have no available fix; inspect the Bun audit output and open security alerts. Compatible fixes still have their own PR.');
