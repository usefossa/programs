[package]
name = "fossa-v2-stress"
version = "0.1.0"
edition = "2021"

[dependencies]
litesvm = "=0.16.0"
solana-account = "4.3.0"
solana-address = { version = "~2.6.1", features = ["curve25519"] }
solana-clock = "~3.1.1"
