[package]
name = "fossa-vm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
anchor-spl = { git = "https://github.com/otter-sec/anchor", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
bincode = "1.3.3"
fossa-dex = { path = "../../dex", features = ["no-entrypoint"] }
inference-router-program = { path = "../..", features = ["no-entrypoint"] }
litesvm = "=0.18.0"
litesvm-token = "=0.18.1"
solana-account = "4.3.0"
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-loader-v3-interface = { version = "7.0.0", features = ["bincode"] }
solana-message = "4.5.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-transaction = "4.2.0"
