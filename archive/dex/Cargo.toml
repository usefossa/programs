[package]
name = "fossa-dex"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", features = ["cpi"] }
pinocchio-token = "0.7.0"
pinocchio-system = "0.6.1"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

