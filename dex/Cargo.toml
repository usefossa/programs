[package]
name = "fossa-dex"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["no-log-ix-name"]
no-log-ix-name = []
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
anchor-spl = { git = "https://github.com/otter-sec/anchor", rev = "a20660219882af5f199d56ea3f9326f387f89d8b" }
bincode = "1.3.3"
bytemuck = { version = "1", features = ["derive"] }
solana-loader-v3-interface = { version = "7.0.0", features = ["bincode"] }
solana-sdk-ids = "3.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

